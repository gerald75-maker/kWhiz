<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Icône kWhiz</title>
  <desc id="desc">Monogramme kW cyan et vert traversé par un éclair blanc sur fond bleu nuit.</desc>
  <rect width="1024" height="1024" fill="#071A3D"/>

  <!-- K cyan : forme volontairement massive pour rester lisible à petite taille. -->
  <path fill="#10C8F2" d="M250 300h126l-72 185 205-153-62 153-112 84 78 155H286l-44-95-37 95H79l171-424Z" transform="translate(120 0)"/>

  <!-- W vert : silhouette simple, distincte du K et contenue dans la zone maskable. -->
  <path fill="#32D676" d="M505 420h112l38 139 69-139h111L680 724H570l-37-137-68 137H355l92-181 58-123Z"/>

  <!-- Éclair blanc central, suffisamment épais pour les tailles 32–60 px. -->
  <path fill="#FFFFFF" d="M544 350 413 548h82l-64 154 180-234h-86l67-118h-48Z"/>
</svg>
